# 실제 NVIDIA 모델(Hugging Face)로 Colab과 비슷한 환경에서 전체 점검. Actions 탭에서 수동 실행하거나 코드 변경 시 자동 실행.
name: real-model-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/student_report.py", "tools/agent_setup.sh", "pyproject.toml", "sonic_lab/**", "notebooks/**", "exercises/**", "requirements*.txt", "tools/real_model_check.py", ".github/workflows/real-model-check.yml"]
jobs:
  colab-like:
    if: github.repository == 'kehdgus9434/sonic-vibe-coding-lab'   # 학생 Fork에서는 student-check만 실행
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: System packages (Colab CPU 런타임과 같은 소프트웨어 렌더러)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6 ffmpeg fonts-nanum
      - name: Python packages (Colab 기본 패키지 + requirements-colab.txt)
        run: pip install -q -r requirements-colab.txt numpy scipy pandas matplotlib pyyaml joblib imageio pillow nbclient nbformat ipykernel
      - run: python -m ipykernel install --user --name python3
      - name: 웹 에이전트 setup 스크립트 점검 (Claude Code on the web / Codex에 붙여 넣는 것과 동일)
        run: SONIC_LAB_REPO=https://github.com/${{ github.repository }} bash tools/agent_setup.sh
      - run: python tools/real_model_check.py --out outputs/real_check
      - name: 학생 리포트 스크립트 점검 (my_work 미작성 상태)
        run: python tools/student_report.py --out outputs/real_check/student_report_stub
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: real-model-check
          path: outputs/real_check
