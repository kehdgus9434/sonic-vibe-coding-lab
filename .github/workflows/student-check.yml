# 학생 작업 자동 리포트: main 이외의 브랜치에 push하면(웹 코딩 에이전트가 push하는 브랜치) 실제 NVIDIA 모델로 실행하고
#  ① Actions 실행 요약(Summary)  ② 열린 PR의 댓글  ③ reports 브랜치(그림·Colab 노트북)  ④ Artifacts(mp4)로 결과를 보여 줍니다.
# Fork에서는 처음 한 번 Actions 탭에서 "I understand my workflows, go ahead and enable them"을 눌러야 실행됩니다.
name: student-check
on:
  push:
    branches-ignore: [main, reports]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: student-check-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      BRANCH: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6 fonts-nanum
      - name: Python packages
        run: pip install -q -r requirements-colab.txt numpy scipy pandas matplotlib pyyaml joblib imageio pillow
      - name: Run my work with the real model
        run: |
          SAFE=$(echo "$BRANCH" | tr '/' '-')
          echo "SAFE=$SAFE" >> "$GITHUB_ENV"
          python tools/student_report.py --out outputs/report --repo "$REPO" --branch "$BRANCH" \
            --assets-url "https://raw.githubusercontent.com/$REPO/reports/$SAFE" \
            --colab-prefix "https://colab.research.google.com/github/$REPO/blob/reports/$SAFE" \
            --cache-key "${GITHUB_SHA::7}"
          cat outputs/report/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish images and Colab notebooks to the reports branch
        run: |
          git config user.name "student-check[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 origin reports 2>/dev/null; then
            git worktree add -q /tmp/reports FETCH_HEAD && git -C /tmp/reports checkout -q -B reports
          else
            git worktree add -q --detach /tmp/reports && git -C /tmp/reports checkout -q --orphan reports && git -C /tmp/reports rm -rqf .
            printf '# 자동 리포트 저장소 (student-check가 관리)\n' > /tmp/reports/README.md
          fi
          rm -rf "/tmp/reports/$SAFE" && mkdir -p "/tmp/reports/$SAFE"
          cp -r outputs/report/report.md outputs/report/colab "/tmp/reports/$SAFE/"
          cp outputs/report/*.gif outputs/report/*.png "/tmp/reports/$SAFE/" 2>/dev/null || true
          cd /tmp/reports && git add -A && git commit -qm "report: $BRANCH @ ${GITHUB_SHA::7}"
          for i in 1 2 3; do git push -q origin HEAD:reports && break; git pull -q --rebase origin reports; done
      - name: Comment on the open pull request
        run: |
          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$REPO" --body-file outputs/report/report.md --edit-last \
              || gh pr comment "$PR" --repo "$REPO" --body-file outputs/report/report.md
          else
            echo "열린 PR이 없어 댓글은 생략 (결과는 Summary와 reports 브랜치에 있음)"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: student-report-${{ env.SAFE }}
          path: outputs/report
