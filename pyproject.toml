[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-vibe-coding-lab"
version = "1.1.0"
description = "SONIC(NVIDIA GEAR-SONIC) 바이브 코딩 실습 지원 패키지"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2", "matplotlib>=3.7,<4", "PyYAML>=6,<7",
  "joblib>=1.3,<2", "imageio>=2.34,<3", "imageio-ffmpeg>=0.5,<1", "Pillow>=10",
  "onnxruntime>=1.19,<2", "mujoco>=3.3,<4", "PyOpenGL>=3.1",
]

[tool.setuptools]
packages = ["sonic_lab"]
